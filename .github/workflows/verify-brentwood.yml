name: Brentwood synthetic security checks
on:
  pull_request:
  push:
    branches:
      - audit/brentwood-signed-session-20261102
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node syntax
        run: |
          node --check netlify/shared/brentwood-session.js
          node --check netlify/functions/auth.js
          node --check netlify/functions/chat-brentwood.js
      - name: Check inline browser script syntax
        run: |
          node -e 'const fs = require("node:fs"); const vm = require("node:vm"); const html = fs.readFileSync("public/index.html", "utf8"); const m = html.match(/<script data-cfasync="false">([\s\S]*?)<\/script>/); if (!m) throw Error("Browser script missing"); new vm.Script(m[1]);'
      - name: Run synthetic-only regression suite
        run: node --test tests/*.test.js
